<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>글 관리자 · coldlose</title>
  </head>
  <body>
    <!-- Sveltia CMS: 가벼운 Git 기반 관리자 패널 -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>

    <!-- 실제 블로그 디자인에 맞춘 커스텀 미리보기 -->
    <script>
      // 미리보기 창에 입힐 스타일 (실제 글 페이지와 동일한 다크 톤)
      var previewCSS = [
        "@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');",
        ":root{color-scheme:dark}",
        "body{margin:0;background:#0b0d10;color:#e7e8ea;font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}",
        ".prev-article{max-width:720px;margin:0 auto;padding:48px 28px}",
        ".prev-meta{display:flex;gap:10px;align-items:center;font-size:13px;color:#6b6f77;text-transform:uppercase;letter-spacing:.05em}",
        ".prev-meta .cat{color:#9a9ea5}",
        ".prev-title{font-size:clamp(28px,6vw,42px);font-weight:800;letter-spacing:-.035em;line-height:1.12;margin:14px 0 0}",
        ".prev-desc{color:#9a9ea5;font-size:16px;margin:14px 0 0}",
        ".prev-body{margin-top:32px;padding-top:28px;border-top:1px solid #1a1c22;font-size:16px;line-height:1.8}",
        ".prev-body h2{font-size:24px;margin:40px 0 14px;font-weight:700;letter-spacing:-.02em}",
        ".prev-body h3{font-size:19px;margin:30px 0 10px}",
        ".prev-body p{margin:16px 0}",
        ".prev-body a{color:#e7e8ea;text-decoration:underline;text-underline-offset:3px}",
        ".prev-body ul,.prev-body ol{padding-left:22px}",
        ".prev-body li{margin:6px 0}",
        ".prev-body img{max-width:100%;border-radius:8px;border:1px solid #22252b}",
        ".prev-body blockquote{border-left:3px solid #22252b;margin:20px 0;padding:2px 18px;color:#9a9ea5}",
        ".prev-body code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.88em;background:#14161b;border:1px solid #1a1c22;padding:2px 6px;border-radius:6px}",
        ".prev-body pre{background:#0d1117;border:1px solid #22252b;border-radius:8px;padding:16px 18px;overflow-x:auto}",
        ".prev-body pre code{background:none;border:0;padding:0}",
        ".prev-body hr{border:0;border-top:1px solid #22252b;margin:40px 0}",
      ].join("\n");

      // 날짜를 "2026년 11월 4일" 형식으로
      function formatDateKo(raw) {
        if (!raw) return "";
        var d = new Date(raw);
        if (isNaN(d.getTime())) return String(raw);
        return d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일";
      }

      // 글 미리보기 컴포넌트 (실제 글 페이지와 동일한 구조)
      function PostPreview(props) {
        var data = props.entry.get("data");
        var title = data.get("title") || "제목을 입력하세요";
        var cat = data.get("category") || "";
        var desc = data.get("description") || "";
        var dateStr = formatDateKo(data.get("date"));

        return html`
          <article class="prev-article">
            <div class="prev-meta">
              ${cat ? html`<span class="cat">${cat}</span>` : ""}
              ${cat && dateStr ? html`<span>·</span>` : ""}
              ${dateStr ? html`<span>${dateStr}</span>` : ""}
            </div>
            <h1 class="prev-title">${title}</h1>
            ${desc ? html`<p class="prev-desc">${desc}</p>` : ""}
            <div class="prev-body">${props.widgetFor("body")}</div>
          </article>
        `;
      }

      // CMS(모듈)가 로드될 때까지 기다렸다가 등록
      (function register() {
        if (!window.CMS || !window.html) {
          setTimeout(register, 50);
          return;
        }
        try {
          window.CMS.registerPreviewStyle(previewCSS, { raw: true });
          window.CMS.registerPreviewTemplate("posts", PostPreview);
        } catch (e) {
          console.error("커스텀 미리보기 등록 실패:", e);
        }
      })();
    </script>
  </body>
</html>
