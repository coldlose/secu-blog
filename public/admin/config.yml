# Sveltia CMS 설정 — 글 관리자(/admin)
#
# ▶ repo 를 본인 GitHub 저장소로 바꾸세요: "GitHub아이디/저장소이름"
#   예) repo: coldlose/secu-blog
# ▶ branch 는 기본 브랜치(보통 main)로 맞추세요.
backend:
  name: github
  repo: coldlose/secu-blog
  branch: main

# 로컬에서 테스트할 때만 주석 해제 (npx @sveltia/cms-proxy-server 실행 필요)
# local_backend: true

# 이미지 업로드 위치
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: 글
    label_singular: 글
    description: 블로그 글을 작성/수정합니다.
    folder: src/content/posts
    create: true
    extension: md
    format: frontmatter
    # 파일명(=주소) : 작성일 + 제목 기반
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "posts/{{slug}}"
    sortable_fields: [date, title]
    # 미리보기 창 켜기 (index.html에서 실제 블로그 디자인에 맞춘 커스텀 미리보기를 등록함)
    editor:
      preview: true
    fields:
      - { name: title, label: 제목, widget: string }
      - {
          name: date,
          label: 날짜,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD",
        }
      - {
          name: category,
          label: 카테고리,
          widget: select,
          options: [Memory, Study, CTF, Bugbounty, Analysis],
          default: Study,
        }
      - { name: description, label: 설명(한 줄), widget: string, required: false }
      - { name: draft, label: 초안으로 숨기기, widget: boolean, default: false, required: false }
      - { name: body, label: 본문, widget: markdown }

  # About 페이지 내용 (수상·자격증·활동·학력) — 코드 수정 없이 /admin에서 편집
  - name: about
    label: About 페이지
    description: About 페이지의 수상·자격증·활동·학력을 추가/수정합니다.
    files:
      - name: about
        label: About 내용
        file: src/data/about.json
        fields:
          - name: awards
            label: 수상
            label_singular: 수상
            widget: list
            summary: "{{fields.when}}  {{fields.main}}"
            fields:
              - { name: when, label: 날짜, widget: string, required: false, hint: "예) 2026.10 (비워도 됨)" }
              - { name: main, label: 제목, widget: string }
              - { name: by, label: 부가 설명, widget: string, required: false }
          - name: certificates
            label: 자격증
            label_singular: 자격증
            widget: list
            summary: "{{fields.when}}  {{fields.main}}"
            fields:
              - { name: when, label: 날짜, widget: string, required: false }
              - { name: main, label: 제목, widget: string }
              - { name: by, label: 부가 설명, widget: string, required: false }
          - name: activities
            label: 활동
            label_singular: 활동
            widget: list
            summary: "{{fields.when}}  {{fields.main}}"
            fields:
              - { name: when, label: 날짜, widget: string, required: false }
              - { name: main, label: 제목, widget: string }
              - { name: by, label: 부가 설명, widget: string, required: false }
          - name: education
            label: 학력
            label_singular: 학력
            widget: list
            summary: "{{fields.main}}"
            fields:
              - { name: when, label: 날짜, widget: string, required: false }
              - { name: main, label: 학교·학과, widget: string }
              - { name: by, label: 기간·상태, widget: string, required: false }
